# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  path_filters:
    # Command reference, generated by 'go generate ./...' (CI checks it's up to date).
    - "!docs/**"
    # Kinde's API specs, pinned unchanged from api-spec.kinde.com.
    - "!api/**"
    # Go code generated from the specs.
    - "!**/*_gen.go"
