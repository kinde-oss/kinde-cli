name: KindeCI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'

    - name: Test
      run: go test -v ./...

    - name: Check generated files are up to date
      run: |
        go generate ./...
        git add -N .
        git diff --exit-code || (echo "Generated files are out of date: run 'go generate ./...' and commit the result" && exit 1)

    - id: govulncheck
      uses: golang/govulncheck-action@v1
      with:
         go-package: ./...
